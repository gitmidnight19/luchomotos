# Instalar los ganchos una vez:  npm run hooks
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^movil/tsconfig\.json$   # admite comentarios
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'uv run --directory backend mypy app'
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      # Formato + orden de imports. biome.json excluye el contrato generado
      # openapi.d.ts: si lo tocara, el job `contrato` del CI daria falso positivo.
      - id: biome
        name: biome (movil)
        entry: bash -c 'cd movil && npx biome check --write app src'
        language: system
        pass_filenames: false
        files: ^movil/(app|src)/.*\.(ts|tsx|json)$

      - id: eslint
        name: eslint (movil)
        entry: bash -c 'cd movil && npx eslint .'
        language: system
        pass_filenames: false
        files: ^movil/(app|src)/.*\.(ts|tsx)$
