name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependencias
        run: uv sync --all-extras --locked

      - name: Linter
        run: uv run ruff check app tests

      - name: Formato
        run: uv run ruff format --check app tests

      - name: Tipos
        run: uv run mypy app

      - name: Pruebas
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Las migraciones reflejan los modelos
        run: |
          uv run alembic upgrade head
          uv run alembic check

  movil:
    name: App (eslint · tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: movil/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Biome)
        run: npm run format:check

      - name: Linter (ESLint + reglas de Expo)
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

  contrato:
    name: El contrato TS esta al dia con la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: movil/package-lock.json

      - run: uv sync --directory backend --all-extras --locked
      - run: npm ci
        working-directory: movil

      # Regenera los tipos desde el esquema y falla si difieren de lo commiteado:
      # asi no puede colarse un cambio de API sin actualizar el frontend.
      - name: Regenerar y comparar
        run: |
          uv run --directory ../backend python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > /tmp/openapi.json
          npx openapi-typescript /tmp/openapi.json -o src/api/openapi.d.ts
          git diff --exit-code src/api/openapi.d.ts
        working-directory: movil
